<title>Torre de Controle Arruda</title>

<style id="estilo">
  /* ------------------------------------------------------------------
     Paleta ancorada na identidade real do Hub Arruda: navy #141e33 e
     dourado #c8a55d, as mesmas cores da sidebar do /admin. Neutros com
     viés navy (não cinza puro). Semânticos separados do accent.
     ------------------------------------------------------------------ */
  :root {
    --navy:        #141e33;
    --ouro:        #c8a55d;
    --ouro-fundo:  #f3ead6;

    --ground:      #e9ecf2;
    --surface:     #fbfcfe;
    --surface-2:   #f2f4f8;
    --linha:       #ccd2de;
    --linha-forte: #aab3c4;

    --texto:       #161d2e;
    --texto-suave: #545d72;
    --texto-fraco: #7c8496;

    --trava:       #a8331f;
    --trava-fundo: #fbe9e5;
    --atencao:     #8a6209;
    --atencao-fundo:#faf0d8;
    --ok:          #2f5c42;
    --ok-fundo:    #e4efe7;

    --plan-barra:  #141e33;

    --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;

    --sombra: 0 1px 2px rgba(20, 30, 51, .06), 0 6px 16px -8px rgba(20, 30, 51, .14);
    --borda-topo: #141e33;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #0e1626;
      --surface:     #162033;
      --surface-2:   #1d2840;
      --linha:       #2c3956;
      --linha-forte: #445271;

      --texto:       #e8ecf5;
      --texto-suave: #a2adc4;
      --texto-fraco: #7d89a3;

      --ouro:        #d9b872;
      --ouro-fundo:  #3a2f18;

      --trava:       #ff9b85;
      --trava-fundo: #3d1a13;
      --atencao:     #e8bd5c;
      --atencao-fundo:#392d0e;
      --ok:          #8ed6a8;
      --ok-fundo:    #16321f;

      --plan-barra:  #445271;
      --borda-topo:  #445271;

      --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .55);
    }
  }

  :root[data-theme="dark"] {
    --ground:      #0e1626;
    --surface:     #162033;
    --surface-2:   #1d2840;
    --linha:       #2c3956;
    --linha-forte: #445271;

    --texto:       #e8ecf5;
    --texto-suave: #a2adc4;
    --texto-fraco: #7d89a3;

    --ouro:        #d9b872;
    --ouro-fundo:  #3a2f18;

    --trava:       #ff9b85;
    --trava-fundo: #3d1a13;
    --atencao:     #e8bd5c;
    --atencao-fundo:#392d0e;
    --ok:          #8ed6a8;
    --ok-fundo:    #16321f;

    --plan-barra:  #445271;
    --borda-topo:  #445271;

    --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--texto);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 22px 64px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* ---------- cabeçalho ---------- */

  .topo {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--borda-topo);
  }

  .topo h1 {
    margin: 0;
    font-size: 27px;
    line-height: 1.15;
    font-weight: 650;
    letter-spacing: -.015em;
    text-wrap: balance;
  }
  .topo h1 .marca { color: var(--ouro); }

  .topo .sub {
    margin: 5px 0 0;
    color: var(--texto-suave);
    font-size: 13.5px;
    max-width: 62ch;
  }

  .carimbo {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--texto-fraco);
    text-align: right;
    line-height: 1.7;
    white-space: nowrap;
  }
  .carimbo b { color: var(--texto-suave); font-weight: 600; }

  /* ---------- instrumentos ---------- */

  .instrumentos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px;
    background: var(--linha);
    border: 1px solid var(--linha);
    box-shadow: var(--sombra);
  }
  .instr {
    background: var(--surface);
    padding: 11px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .instr .rot {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--texto-fraco);
  }
  .instr .val {
    font-size: 15px;
    font-weight: 640;
    font-variant-numeric: tabular-nums;
  }
  .instr .val.bom { color: var(--ok); }

  /* ---------- caixa do Luiz ---------- */

  .luiz {
    background: var(--surface);
    border: 1px solid var(--linha);
    border-left: 5px solid var(--ouro);
    box-shadow: var(--sombra);
  }
  .luiz > header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--linha);
    background: var(--ouro-fundo);
  }
  .luiz > header h2 {
    margin: 0;
    font-size: 16.5px;
    font-weight: 650;
    letter-spacing: -.01em;
  }
  .luiz > header .nota {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--texto-suave);
  }
  .luiz > header .cab-dir {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .luiz > header .ver-feitos {
    background: transparent;
    border-color: var(--linha-forte);
    color: var(--texto-suave);
  }
  .luiz > header .ver-feitos:hover { border-color: var(--ouro); color: var(--ouro); }

  .tarefas { list-style: none; margin: 0; padding: 0; }
  .tarefas > li {
    display: grid;
    grid-template-columns: 104px 1fr;
    gap: 4px 16px;
    padding: 13px 18px;
    border-bottom: 1px solid var(--linha);
  }
  .tarefas > li:last-child { border-bottom: 0; }
  /* `display: grid` acima vence o [hidden] do navegador — sem esta linha,
     esconder um item não funcionaria. */
  .tarefas > li[hidden] { display: none; }
  .tarefas .quando {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding-top: 4px;
  }
  .tarefas .agora   { color: var(--trava); font-weight: 700; }
  .tarefas .logo    { color: var(--atencao); font-weight: 700; }
  .tarefas .depois  { color: var(--texto-fraco); }
  .tarefas .feito   { color: var(--ok); font-weight: 700; }

  .tarefas .titulo { font-weight: 600; }
  .tarefas .corpo {
    margin: 3px 0 0;
    color: var(--texto-suave);
    font-size: 13.5px;
    max-width: 78ch;
  }
  .tarefas li.concluida .titulo {
    color: var(--texto-fraco);
    text-decoration: line-through;
    text-decoration-color: var(--linha-forte);
    font-weight: 500;
  }

  /* itens concluídos vêm fechados — clicar abre. Ocupam uma linha só. */
  .tarefas details > summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 1px 0;
  }
  .tarefas details > summary::-webkit-details-marker { display: none; }
  .tarefas details > summary::before {
    content: "▸";
    font-size: 11px;
    color: var(--texto-fraco);
    flex: none;
    transition: transform .12s ease;
  }
  .tarefas details[open] > summary::before { content: "▾"; }
  .tarefas details > summary:hover .titulo { color: var(--texto-suave); }
  .tarefas details > summary:focus-visible { outline: 2px solid var(--ouro); outline-offset: 3px; }
  .tarefas details > summary .resumo {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--texto-fraco);
    flex: none;
  }
  .tarefas details .detalhe { padding-top: 4px; }

  /* "Início em" do bloco Fazendo agora */
  .inicio {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--texto-fraco);
    margin: 0 0 7px;
    display: block;
  }
  .inicio b { color: var(--texto-suave); font-weight: 600; }
  .inicio.sinal, .inicio.semdec { margin-top: -3px; }
  .inicio.semdec { color: var(--atencao); }
  .crono {
    display: inline-block;
    font-weight: 700;
    padding: 1px 6px;
    border: 1px solid var(--linha-forte);
    margin-right: 4px;
  }
  .crono.ok      { color: var(--ok);      border-color: var(--ok);      background: var(--ok-fundo); }
  .crono.atencao { color: var(--atencao); border-color: var(--atencao); background: var(--atencao-fundo); }
  .crono.tarde   { color: var(--trava);   border-color: var(--trava);   background: var(--trava-fundo); }

  /* bloco "Já entregou" fechado por padrão, dentro do card do agente */
  /* o histórico é um botão de verdade, não um rótulo discreto */
  .bloco details > summary { cursor: pointer; list-style: none; }
  .bloco details > summary::-webkit-details-marker { display: none; }
  .bloco details > summary .botao-hist {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .02em;
    padding: 5px 11px;
    color: var(--texto);
    background: var(--surface-2);
    border: 1px solid var(--linha-forte);
    line-height: 1.5;
  }
  .bloco details > summary .botao-hist::after { content: "▸"; color: var(--texto-fraco); }
  .bloco details[open] > summary .botao-hist::after { content: "▾"; }
  .bloco details > summary:hover .botao-hist { border-color: var(--ouro); color: var(--ouro); }
  .bloco details > summary:focus-visible { outline: none; }
  .bloco details > summary:focus-visible .botao-hist { outline: 2px solid var(--ouro); outline-offset: 2px; }
  .bloco details > ul { margin-top: 7px; }
  .bloco details .qdo {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--texto-fraco);
    white-space: nowrap;
    margin-left: 6px;
  }
  @media (prefers-reduced-motion: reduce) {
    .tarefas details > summary::before { transition: none; }
  }

  .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; align-items: center; }
  a.botao, button.botao {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .02em;
    padding: 5px 11px;
    color: var(--texto);
    background: var(--surface-2);
    border: 1px solid var(--linha-forte);
    text-decoration: none;
    cursor: pointer;
    line-height: 1.5;
  }
  a.botao:hover, button.botao:hover { border-color: var(--ouro); color: var(--ouro); }
  a.botao:focus-visible, button.botao:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
  button.botao.principal {
    border-color: var(--ouro);
    background: var(--ouro-fundo);
    color: var(--texto);
    font-weight: 700;
  }
  button.botao[disabled] { opacity: .55; cursor: default; }

  /* ---------- responder ---------- */

  .responder { margin-top: 10px; }
  .responder[hidden] { display: none; }
  .responder textarea {
    width: 100%;
    min-height: 78px;
    resize: vertical;
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--texto);
    background: var(--surface-2);
    border: 1px solid var(--linha-forte);
    padding: 9px 11px;
  }
  .responder textarea:focus-visible { outline: 2px solid var(--ouro); outline-offset: 1px; }
  .responder .dica {
    font-size: 12px;
    color: var(--texto-fraco);
    margin: 6px 0 0;
  }

  .respostas { list-style: none; margin: 9px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .respostas li {
    background: var(--ouro-fundo);
    border-left: 3px solid var(--ouro);
    padding: 8px 12px;
    font-size: 13.5px;
  }
  .respostas .autor {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--texto-suave);
    display: block;
    margin-bottom: 2px;
  }
  .respostas .fala { white-space: pre-wrap; }
  .respostas li.doCoord { background: var(--surface-2); border-left-color: var(--linha-forte); }

  /* relógio de espera — quem está parado esperando, e há quanto tempo */
  .espera {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    background: var(--atencao-fundo);
    border: 1px solid var(--atencao);
    border-left: 5px solid var(--atencao);
    box-shadow: var(--sombra);
    padding: 12px 16px;
  }
  .espera.frio { background: var(--trava-fundo); border-color: var(--trava); border-left-color: var(--trava); }
  .espera .relogio {
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--atencao);
    flex: none;
  }
  .espera.frio .relogio { color: var(--trava); }
  .espera .quem { font-size: 13.5px; line-height: 1.5; flex: 1 1 320px; }
  .espera .quem b { font-weight: 700; }
  .espera .acao {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--texto-suave);
    border: 1px dashed var(--linha-forte);
    padding: 4px 9px;
    flex: none;
  }

  /* ---------- grade de agentes ---------- */

  .secao-rot {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--texto-fraco);
  }
  .secao-rot::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--linha);
  }

  .grade {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    gap: 18px;
  }

  .agente {
    background: var(--surface);
    border: 1px solid var(--linha);
    box-shadow: var(--sombra);
    display: flex;
    flex-direction: column;
  }
  .agente.eu { border-color: var(--ouro); border-width: 2px; }
  .agente > header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--linha);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .agente .linha1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .agente h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -.01em;
  }
  .agente .branch {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--texto-fraco);
    word-break: break-all;
  }

  .chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 3px 8px;
    border: 1px solid;
    white-space: nowrap;
    flex: none;
  }
  .chip.rodando  { color: var(--ok);          border-color: var(--ok);          background: var(--ok-fundo); }
  .chip.parado   { color: var(--texto-suave); border-color: var(--linha-forte); background: var(--surface-2); }
  .chip.travado  { color: var(--trava);       border-color: var(--trava);       background: var(--trava-fundo); }
  .chip.cuidado  { color: var(--atencao);     border-color: var(--atencao);     background: var(--atencao-fundo); }
  .chip.aguardando { color: var(--atencao); border-color: var(--atencao); background: var(--atencao-fundo); font-weight: 700; }

  .alerta {
    display: flex;
    gap: 10px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--linha);
    background: var(--trava-fundo);
    border-left: 4px solid var(--trava);
  }
  .alerta.leve {
    background: var(--atencao-fundo);
    border-left-color: var(--atencao);
  }
  .alerta .sinal { font-size: 15px; line-height: 1.3; flex: none; }
  .alerta .txt { font-size: 13px; line-height: 1.5; }

  .corpo-agente {
    padding: 4px 16px 15px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .bloco { padding: 11px 0; border-bottom: 1px dashed var(--linha); }
  .bloco:last-of-type { border-bottom: 0; }
  .bloco .rot {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--texto-fraco);
    margin-bottom: 5px;
  }
  .bloco p { margin: 0; font-size: 13.5px; color: var(--texto-suave); }
  .bloco p + p { margin-top: 5px; }
  .bloco p.destaque { color: var(--texto); font-weight: 560; }
  .bloco ul { margin: 0; padding-left: 4px; font-size: 13.5px; color: var(--texto-suave); list-style: none; }
  .bloco ul li { margin-bottom: 4px; padding-left: 21px; text-indent: -21px; }
  .bloco ul li:last-child { margin-bottom: 0; }
  code {
    font-family: var(--mono);
    font-size: .88em;
    background: var(--surface-2);
    border: 1px solid var(--linha);
    padding: 0 4px;
  }

  .dims { display: flex; flex-direction: column; gap: 7px; margin-top: 2px; }
  .dim { display: grid; grid-template-columns: 84px 1fr 38px; align-items: center; gap: 10px; }
  .dim .nome {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--texto-fraco);
  }
  .trilho { height: 7px; background: var(--surface-2); border: 1px solid var(--linha); display: block; }
  .barra { height: 100%; display: block; }
  .barra.plan { background: var(--plan-barra); }
  .barra.prod { background: var(--ouro); }
  .dim .pct {
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--texto-suave);
  }

  /* ---------- dependência ---------- */

  .dependencia {
    background: var(--surface);
    border: 1px solid var(--linha);
    border-left: 5px solid var(--atencao);
    box-shadow: var(--sombra);
    padding: 15px 18px;
  }
  .dependencia .rota {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--atencao);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .dependencia h3 { margin: 0 0 5px; font-size: 15px; font-weight: 640; }
  .dependencia p { margin: 0 0 7px; font-size: 13.5px; color: var(--texto-suave); max-width: 88ch; }
  .dependencia p:last-child { margin-bottom: 0; }

  /* ---------- rodapé ---------- */

  .rodape {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid var(--linha);
    font-size: 12.5px;
    color: var(--texto-fraco);
  }
  .rodape .links { display: flex; flex-wrap: wrap; gap: 8px; }

  .aviso-ro {
    background: var(--atencao-fundo);
    border: 1px solid var(--atencao);
    color: var(--texto);
    padding: 10px 14px;
    font-size: 13px;
  }
  .aviso-ro[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 620px) {
    .wrap { padding: 20px 14px 48px; }
    .carimbo { text-align: left; }
    .tarefas > li { grid-template-columns: 1fr; }
    .dim { grid-template-columns: 74px 1fr 34px; }
  }
</style>

   "<b>O conserto:</b> instalei um gancho que dispara <b>no fim de cada turno</b> de cada agente e carimba a hora no arquivo de status dele. Não depende de o agente lembrar de nada. A partir daí a torre separa três situações: <b>🟢 trabalhando</b> (tocou código agora há pouco), <b>🟡 aguardando você</b> (encerrou o turno — não volta a se mexer sozinho) e <b>⏸ sem sinal</b> (sumiu sem carimbar, sessão provavelmente fechada).",

<script id="app">
(function () {
  "use strict";

  var dados = JSON.parse(document.getElementById("dados").textContent);
  var podeEscrever = null; // null = ainda não sabemos

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Alguns textos são autorais e contêm <b>/<code>/<em> de propósito.
  // Eles vêm dos dados que eu (Coordenador) escrevo, nunca de digitação do Luiz —
  // o que ele digita passa sempre por esc().
  function rico(s) { return String(s); }

  // "há 1h40" a partir de um ISO — calculado no navegador, então continua certo
  // sem eu republicar. Omite se der resultado impossível (relógio fora de hora).
  function decorrido(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return "";
    var min = Math.floor((Date.now() - t) / 60000);
    if (min < 0 || min > 60 * 24 * 60) return "";
    if (min < 60) return "há " + min + " min";
    var h = Math.floor(min / 60);
    if (h < 48) return "há " + h + "h" + (min % 60 ? String(min % 60).padStart(2, "0") : "");
    return "há " + Math.floor(h / 24) + " dias";
  }

  function minutosDesde(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return null;
    var min = Math.floor((Date.now() - t) / 60000);
    if (min < -5 || min > 60 * 24 * 60) return null;
    return Math.max(min, 0);
  }

  function horaDe(iso) {
    var t = new Date(iso);
    if (isNaN(t.getTime())) return "";
    var p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return p(t.getDate()) + "/" + p(t.getMonth() + 1) + " " + p(t.getHours()) + "h" + p(t.getMinutes());
  }

  function barras(dims) {
    if (!dims) return "";
    return '<div class="bloco"><div class="rot">Evolução do módulo</div><div class="dims">' +
      '<div class="dim"><span class="nome">Planejam.</span><span class="trilho"><span class="barra plan" style="width:' + dims.plan + '%"></span></span><span class="pct">' + dims.plan + '%</span></div>' +
      '<div class="dim"><span class="nome">Produção</span><span class="trilho"><span class="barra prod" style="width:' + dims.prod + '%"></span></span><span class="pct">' + dims.prod + '%</span></div>' +
      '</div></div>';
  }

  function agenteHTML(a) {
    var h = '<article class="agente' + (a.eu ? " eu" : "") + '">';
    h += '<header><div class="linha1"><h3>' + esc(a.nome) + '</h3>' +
         '<span class="chip ' + a.chip.tipo + '">' + esc(a.chip.texto) + '</span></div>' +
         '<span class="branch">' + esc(a.branch) + '</span></header>';

    if (a.alerta) {
      h += '<div class="alerta' + (a.alerta.nivel === "leve" ? " leve" : "") + '">' +
           '<span class="sinal">' + a.alerta.sinal + '</span>' +
           '<span class="txt">' + rico(a.alerta.texto) + '</span></div>';
    }

    h += '<div class="corpo-agente">';

    h += '<div class="bloco"><div class="rot">🔄 Fazendo agora</div>';
    // o "desde quando" vem logo abaixo do título: é a primeira coisa que
    // situa o leitor antes de ele ler o que o agente está fazendo.
    if (a.inicio && a.inicio.iso) {
      var min = minutosDesde(a.inicio.iso);
      var cls = min === null ? "" : (min <= 30 ? "ok" : (min <= 60 ? "atencao" : "tarde"));
      var icone = min === null ? "🕐" : (min <= 30 ? "🟢" : (min <= 60 ? "🟡" : "🔴"));
      var rot = a.inicio.rotulo || horaDe(a.inicio.iso);
      h += '<span class="inicio"><span class="crono ' + cls + '">' + icone + " " +
           esc(decorrido(a.inicio.iso) || "agora") + "</span> nesta tarefa · desde <b>" +
           esc(rot) + "</b></span>";
    }
    if (a.ultimoSinal && a.ultimoSinal.iso) {
      var d2 = decorrido(a.ultimoSinal.iso);
      h += '<span class="inicio sinal">Último arquivo tocado: <b>' + esc(a.ultimoSinal.rotulo) + "</b>" +
           (d2 ? " (" + d2 + ")" : "") + "</span>";
    }
    if (a.semDeclaracao) {
      h += '<span class="inicio semdec">⚪ não declarou status — o que está escrito acima é leitura minha, não dele</span>';
    }
    a.agora.forEach(function (p) { h += "<p>" + rico(p) + "</p>"; });
    h += "</div>";

    h += '<div class="bloco"><div class="rot">Próxima tarefa</div>' +
         '<p class="destaque">' + rico(a.proxima) + "</p>";
    if (a.proximaExtra) h += "<p>" + rico(a.proximaExtra) + "</p>";
    h += "</div>";

    // fechado por padrão: o card mostra o presente, o histórico fica a um clique
    h += '<div class="bloco"><details><summary><span class="botao-hist">✅ Já entregou · ' +
         a.entregue.length + "</span></summary><ul>";
    a.entregue.forEach(function (i) {
      var texto = typeof i === "string" ? i : i.t;
      var quando = typeof i === "string" ? "" : i.q;
      h += "<li>" + rico(texto) + (quando ? '<span class="qdo">' + esc(quando) + "</span>" : "") + "</li>";
    });
    h += "</ul></details></div>";

    h += barras(a.dims);
    h += "</div></article>";
    return h;
  }

  function tarefaHTML(t) {
    // Item concluído vem fechado (<details>): a lista fica curta e o histórico
    // continua a um clique. Item aberto continua sempre visível.
    var fechavel = !!t.concluida;
    var nResp = (t.respostas || []).length;

    var h = '<li class="' + (t.concluida ? "concluida" : "") + '" data-tarefa="' + esc(t.id) + '"' +
            (t.concluida ? " hidden" : "") + ">";
    h += '<span class="quando ' + t.prazo + '">' + esc(t.prazoRot) + "</span>";

    if (fechavel) {
      h += "<details><summary><span class=\"titulo\">" + esc(t.titulo) + "</span>";
      if (nResp) h += '<span class="resumo">' + nResp + (nResp === 1 ? " resposta" : " respostas") + "</span>";
      h += '</summary><div class="detalhe">';
    } else {
      h += "<div>";
      h += '<div class="titulo">' + esc(t.titulo) + "</div>";
    }
    h += '<p class="corpo">' + rico(t.corpo) + "</p>";

    if (t.respostas && t.respostas.length) {
      h += '<ul class="respostas">';
      t.respostas.forEach(function (r) {
        h += "<li" + (r.autor === "coordenador" ? ' class="doCoord"' : "") + "><span class=\"autor\">" + esc(r.autor === "coordenador" ? "Coordenador" : "Luiz") + " · " + esc(r.quando) + '</span><span class="fala">' + esc(r.texto) + "</span></li>";
      });
      h += "</ul>";
    }

    h += '<div class="acoes">';
    (t.acoes || []).forEach(function (a) {
      h += '<a class="botao" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.texto) + "</a>";
    });
    h += '<button class="botao abrir" type="button" data-alvo="' + esc(t.id) + '">💬 Responder</button>';
    h += "</div>";

    h += '<div class="responder" id="resp-' + esc(t.id) + '" hidden>';
    h += '<textarea placeholder="Escreva pro Coordenador… (ex.: já rodei, deu erro no upload)" aria-label="Resposta sobre: ' + esc(t.titulo) + '"></textarea>';
    h += '<div class="acoes">';
    h += '<button class="botao principal enviar" type="button" data-alvo="' + esc(t.id) + '">Enviar pro Coordenador</button>';
    h += '<button class="botao cancelar" type="button" data-alvo="' + esc(t.id) + '">Cancelar</button>';
    h += "</div>";
    h += '<p class="dica">Sua resposta fica registrada aqui no item e chega pro Coordenador com a referência da tarefa.</p>';
    h += "</div>";

    h += fechavel ? "</div></details></li>" : "</div></li>";
    return h;
  }

  function corpoHTML() {
    var h = '<div class="wrap">';

    h += '<header class="topo"><div>' +
         '<h1>Torre de Controle <span class="marca">Arruda</span></h1>' +
         '<p class="sub">Quem está construindo o quê agora, o que já ficou pronto e onde alguém está esperando por alguém. Mantido pelo Coordenador de Agentes — não faz parte do sistema.</p>' +
         "</div>" +
         '<div class="carimbo"><b>' + esc(dados.atualizado) + "</b><br>main em <b>" + esc(dados.commit) + "</b><br>agentes ativos: <b>" + dados.agentes.length + "</b></div>" +
         "</header>";

    h += '<section class="instrumentos" aria-label="Estado geral do projeto">';
    dados.instrumentos.forEach(function (i) {
      h += '<div class="instr"><span class="rot">' + esc(i.rot) + '</span><span class="val' + (i.bom ? " bom" : "") + '">' + esc(i.val) + "</span></div>";
    });
    h += "</section>";

    (dados.esperas || []).forEach(function (e) {
      h += '<div class="espera' + (e.frio ? " frio" : "") + '">' +
           '<span class="relogio">' + esc(e.tempo) + '</span>' +
           '<span class="quem">' + rico(e.texto) + '</span>' +
           '<span class="acao">' + esc(e.acao) + '</span></div>';
    });

    h += '<div class="aviso-ro" id="aviso-ro" hidden>⚠️ Esta visualização está em modo leitura — dá pra acompanhar tudo, mas o botão de responder não vai gravar. Me responda pelo chat mesmo.</div>';

    var nFeitos = dados.tarefas.filter(function (t) { return t.concluida; }).length;
    var nAbertos = dados.tarefas.length - nFeitos;

    h += '<section class="luiz" aria-labelledby="tit-luiz">' +
         '<header><h2 id="tit-luiz">Sua vez, Luiz</h2>' +
         '<span class="cab-dir">' +
         '<span class="nota">' + (nAbertos ? nAbertos + (nAbertos === 1 ? " item aberto" : " itens abertos") : "nada pendente 🎉") + '</span>';
    if (nFeitos) {
      h += '<button class="botao ver-feitos" type="button" aria-expanded="false">▸ ' +
           nFeitos + " já " + (nFeitos === 1 ? "resolvido" : "resolvidos") + "</button>";
    }
    h += "</span></header>" +
         '<ul class="tarefas">';
    dados.tarefas.forEach(function (t) { h += tarefaHTML(t); });
    h += "</ul></section>";

    h += '<div class="secao-rot">Agentes</div><div class="grade">';
    dados.agentes.forEach(function (a) { h += agenteHTML(a); });
    h += "</div>";

    var d = dados.dependencia;
    h += '<div class="secao-rot">Um esperando o outro</div>' +
         '<section class="dependencia"><div class="rota">' + esc(d.rota) + "</div>" +
         "<h3>" + esc(d.titulo) + "</h3>";
    d.paragrafos.forEach(function (p) { h += "<p>" + rico(p) + "</p>"; });
    h += "</section>";

    h += '<footer class="rodape">' +
         "<span>Esta página se atualiza sozinha: quando eu republico, toda janela aberta recarrega — não precisa botão de atualizar nem recarregar na mão. As barras de evolução são leitura minha, não medição automática.</span>" +
         '<span class="links">' +
         '<a class="botao" href="https://github.com/contatoarrudacred/hub-arruda" target="_blank" rel="noopener">repositório</a>' +
         '<a class="botao" href="https://supabase.com/dashboard/project/mzvaqjhalynaceecnayt/sql/new" target="_blank" rel="noopener">SQL Editor</a>' +
         '<a class="botao" href="https://hub-arruda.vercel.app" target="_blank" rel="noopener">app</a>' +
         "</span></footer>";

    h += "</div>";
    return h;
  }

  function render() {
    document.getElementById("raiz").innerHTML = corpoHTML();
    if (podeEscrever === false) {
      var av = document.getElementById("aviso-ro");
      if (av) av.hidden = false;
    }
  }

  // Página completa de substituição — exigida pelo publish(): documento
  // inteiro, começando por doctype. Estilo e script saem das próprias tags
  // (conteúdo autoral, não o DOM vivo), e os dados vão serializados com o
  // estado novo.
  function paginaCompleta() {
    var css = document.getElementById("estilo").textContent;
    var app = document.getElementById("app").textContent;
    var json = JSON.stringify(dados, null, 1).replace(/<\//g, "<\\/");
    return "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
      "<title>Torre de Controle Arruda</title>\n" +
      "<style id=\"estilo\">" + css + "</style>\n</head>\n<body>\n" +
      "<div id=\"raiz\"></div>\n" +
      "<script id=\"dados\" type=\"application/json\">\n" + json + "\n<\/script>\n" +
      "<script id=\"app\">" + app + "<\/script>\n</body>\n</html>";
  }

  function agora() {
    var d = new Date();
    var p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return p(d.getDate()) + "/" + p(d.getMonth() + 1) + " · " + p(d.getHours()) + "h" + p(d.getMinutes());
  }

  function acharTarefa(id) {
    for (var i = 0; i < dados.tarefas.length; i++) {
      if (dados.tarefas[i].id === id) return dados.tarefas[i];
    }
    return null;
  }

  function marcarErro(id, msg) {
    var caixa = document.getElementById("resp-" + id);
    if (!caixa) return;
    var dica = caixa.querySelector(".dica");
    if (dica) dica.textContent = msg;
  }

  async function enviar(id) {
    var caixa = document.getElementById("resp-" + id);
    var ta = caixa.querySelector("textarea");
    var texto = ta.value.trim();
    if (!texto) { ta.focus(); return; }

    var btn = caixa.querySelector(".enviar");
    btn.disabled = true;
    btn.textContent = "Enviando…";

    var api = null;
    try { api = await window.claude.use("artifact"); } catch (e) { api = null; }

    if (!api) {
      podeEscrever = false;
      btn.disabled = false;
      btn.textContent = "Enviar pro Coordenador";
      marcarErro(id, "⚠️ Não consegui gravar daqui (visualização em modo leitura). Copie o texto e me mande pelo chat.");
      var av = document.getElementById("aviso-ro");
      if (av) av.hidden = false;
      return;
    }

    var tarefa = acharTarefa(id);
    tarefa.respostas = tarefa.respostas || [];
    tarefa.respostas.push({ quando: agora(), texto: texto });

    try {
      await api.publish(paginaCompleta());
      // Publicou: a própria view recarrega na versão nova.
    } catch (err) {
      var code = err && err.code ? err.code : "upstream_error";
      if (code === "conflict") {
        // Rotina: outra versão entrou antes. A view já está recarregando.
        return;
      }
      // Desfaz o otimismo e explica.
      tarefa.respostas.pop();
      btn.disabled = false;
      btn.textContent = "Enviar pro Coordenador";
      if (code === "not_writer" || code === "not_granted" || code === "capability_disabled" || code === "not_declared") {
        podeEscrever = false;
        var av2 = document.getElementById("aviso-ro");
        if (av2) av2.hidden = false;
        marcarErro(id, "⚠️ Esta visualização é só leitura. Copie o texto e me mande pelo chat.");
      } else if (code === "rate_limited") {
        marcarErro(id, "⏳ Muitas respostas seguidas. Espere alguns segundos e tente de novo.");
      } else {
        marcarErro(id, "⚠️ Não consegui gravar agora. Tente de novo em instantes — se insistir, me mande pelo chat.");
      }
    }
  }

  document.addEventListener("click", function (ev) {
    var alvo = ev.target.closest ? ev.target.closest("button.botao") : null;
    if (!alvo) return;

    // mostrar/esconder o histórico de itens já resolvidos
    if (alvo.classList.contains("ver-feitos")) {
      var feitos = document.querySelectorAll('.tarefas > li.concluida');
      var vaiMostrar = alvo.getAttribute("aria-expanded") !== "true";
      for (var i = 0; i < feitos.length; i++) feitos[i].hidden = !vaiMostrar;
      alvo.setAttribute("aria-expanded", vaiMostrar ? "true" : "false");
      alvo.textContent = (vaiMostrar ? "▾ esconder " : "▸ ") + feitos.length +
        (vaiMostrar ? " resolvidos" : " já " + (feitos.length === 1 ? "resolvido" : "resolvidos"));
      return;
    }

    var id = alvo.getAttribute("data-alvo");
    if (!id) return;

    if (alvo.classList.contains("abrir")) {
      var caixa = document.getElementById("resp-" + id);
      caixa.hidden = !caixa.hidden;
      if (!caixa.hidden) caixa.querySelector("textarea").focus();
    } else if (alvo.classList.contains("cancelar")) {
      var c = document.getElementById("resp-" + id);
      c.querySelector("textarea").value = "";
      c.hidden = true;
    } else if (alvo.classList.contains("enviar")) {
      enviar(id);
    }
  });

  render();
})();
</script>
