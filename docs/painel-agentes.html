  .topo {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;

  .topo .sub {

  }

  .carimbo {
    font-family: var(--mono);

    white-space: nowrap;
  }
  .carimbo b { color: var(--texto-suave); font-weight: 600; }

  /* ---------- instrumentos ---------- */

  .instrumentos {
    display: grid;

    gap: 1px;
    background: var(--linha);
    border: 1px solid var(--linha);
    box-shadow: var(--sombra);
  }
  .instr {
    background: var(--surface);
    padding: 11px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .instr .rot {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--texto-fraco);
  }
  .instr .val {
    font-size: 15px;
    font-weight: 640;
    font-variant-numeric: tabular-nums;
  }
  .instr .val.bom { color: var(--ok); }

    background: var(--surface);
    border: 1px solid var(--linha);
    border-left: 5px solid var(--ouro);
    box-shadow: var(--sombra);
  }
  .luiz > header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--linha);
    background: var(--ouro-fundo);

  .luiz > header h2 {

    font-size: 16.5px;
    font-weight: 650;
    letter-spacing: -.01em;

  .luiz > header .nota {

    font-size: 11px;
    color: var(--texto-suave);

  .tarefas .logo    { color: var(--atencao); font-weight: 700; }

  .tarefas .feito   { color: var(--ok); font-weight: 700; }

  .tarefas .corpo {

    color: var(--texto-suave);
    font-size: 13.5px;
    max-width: 78ch;
  }

    color: var(--texto-fraco);
    text-decoration: line-through;
    text-decoration-color: var(--linha-forte);

  }

    display: inline-block;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .02em;
    padding: 5px 11px;
    color: var(--texto);
    background: var(--surface-2);
    border: 1px solid var(--linha-forte);
    text-decoration: none;
    cursor: pointer;
    line-height: 1.5;

  a.botao:focus-visible, button.botao:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }

    border-color: var(--ouro);
    background: var(--ouro-fundo);
    color: var(--texto);
    font-weight: 700;
  }

  /* ---------- responder ---------- */

  .responder { margin-top: 10px; }
  .responder[hidden] { display: none; }
  .responder textarea {
    width: 100%;
    min-height: 78px;
    resize: vertical;
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.5;

    background: var(--surface-2);

    background: var(--surface);

    .tarefas > li { grid-template-columns: 1fr; }

  }

<script id="app">
(function () {
  "use strict";

  var dados = JSON.parse(document.getElementById("dados").textContent);
  var podeEscrever = null; // null = ainda não sabemos

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Alguns textos são autorais e contêm <b>/<code>/<em> de propósito.
  // Eles vêm dos dados que eu (Coordenador) escrevo, nunca de digitação do Luiz —
  // o que ele digita passa sempre por esc().
  function rico(s) { return String(s); }

  function barras(dims) {
    if (!dims) return "";
    return '<div class="bloco"><div class="rot">Evolução do módulo</div><div class="dims">' +
      '<div class="dim"><span class="nome">Planejam.</span><span class="trilho"><span class="barra plan" style="width:' + dims.plan + '%"></span></span><span class="pct">' + dims.plan + '%</span></div>' +
      '<div class="dim"><span class="nome">Produção</span><span class="trilho"><span class="barra prod" style="width:' + dims.prod + '%"></span></span><span class="pct">' + dims.prod + '%</span></div>' +
      '</div></div>';
  }

  function agenteHTML(a) {
    var h = '<article class="agente' + (a.eu ? " eu" : "") + '">';
    h += '<header><div class="linha1"><h3>' + esc(a.nome) + '</h3>' +
         '<span class="chip ' + a.chip.tipo + '">' + esc(a.chip.texto) + '</span></div>' +
         '<span class="branch">' + esc(a.branch) + '</span></header>';

    if (a.alerta) {
      h += '<div class="alerta' + (a.alerta.nivel === "leve" ? " leve" : "") + '">' +
           '<span class="sinal">' + a.alerta.sinal + '</span>' +
           '<span class="txt">' + rico(a.alerta.texto) + '</span></div>';
    }

    h += '<div class="corpo-agente">';

    h += '<div class="bloco"><div class="rot">🔄 Fazendo agora</div>';
    a.agora.forEach(function (p) { h += "<p>" + rico(p) + "</p>"; });
    h += "</div>";

    h += '<div class="bloco"><div class="rot">Próxima tarefa</div>' +
         '<p class="destaque">' + rico(a.proxima) + "</p>";
    if (a.proximaExtra) h += "<p>" + rico(a.proximaExtra) + "</p>";
    h += "</div>";

    h += '<div class="bloco"><div class="rot">Já entregou</div><ul>';
    a.entregue.forEach(function (i) { h += "<li>" + rico(i) + "</li>"; });
    h += "</ul></div>";

    h += barras(a.dims);
    h += "</div></article>";
    return h;
  }

  function tarefaHTML(t) {
    var h = '<li class="' + (t.concluida ? "concluida" : "") + '" data-tarefa="' + esc(t.id) + '">';
    h += '<span class="quando ' + t.prazo + '">' + esc(t.prazoRot) + "</span>";
    h += "<div>";
    h += '<div class="titulo">' + esc(t.titulo) + "</div>";
    h += '<p class="corpo">' + rico(t.corpo) + "</p>";

    if (t.respostas && t.respostas.length) {
      h += '<ul class="respostas">';
      t.respostas.forEach(function (r) {
        h += "<li" + (r.autor === "coordenador" ? ' class="doCoord"' : "") + "><span class=\"autor\">" + esc(r.autor === "coordenador" ? "Coordenador" : "Luiz") + " · " + esc(r.quando) + '</span><span class="fala">' + esc(r.texto) + "</span></li>";
      });
      h += "</ul>";
    }

    h += '<div class="acoes">';
    (t.acoes || []).forEach(function (a) {
      h += '<a class="botao" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.texto) + "</a>";
    });
    h += '<button class="botao abrir" type="button" data-alvo="' + esc(t.id) + '">💬 Responder</button>';
    h += "</div>";

    h += '<div class="responder" id="resp-' + esc(t.id) + '" hidden>';
    h += '<textarea placeholder="Escreva pro Coordenador… (ex.: já rodei, deu erro no upload)" aria-label="Resposta sobre: ' + esc(t.titulo) + '"></textarea>';
    h += '<div class="acoes">';
    h += '<button class="botao principal enviar" type="button" data-alvo="' + esc(t.id) + '">Enviar pro Coordenador</button>';
    h += '<button class="botao cancelar" type="button" data-alvo="' + esc(t.id) + '">Cancelar</button>';
    h += "</div>";
    h += '<p class="dica">Sua resposta fica registrada aqui no item e chega pro Coordenador com a referência da tarefa.</p>';
    h += "</div>";

    h += "</div></li>";
    return h;
  }

  function corpoHTML() {
    var h = '<div class="wrap">';

    h += '<header class="topo"><div>' +
         '<h1>Torre de Controle <span class="marca">Arruda</span></h1>' +
         '<p class="sub">Quem está construindo o quê agora, o que já ficou pronto e onde alguém está esperando por alguém. Mantido pelo Coordenador de Agentes — não faz parte do sistema.</p>' +
         "</div>" +
         '<div class="carimbo"><b>' + esc(dados.atualizado) + "</b><br>main em <b>" + esc(dados.commit) + "</b><br>agentes ativos: <b>" + dados.agentes.length + "</b></div>" +
         "</header>";

    h += '<section class="instrumentos" aria-label="Estado geral do projeto">';
    dados.instrumentos.forEach(function (i) {
      h += '<div class="instr"><span class="rot">' + esc(i.rot) + '</span><span class="val' + (i.bom ? " bom" : "") + '">' + esc(i.val) + "</span></div>";
    });
    h += "</section>";

    h += '<div class="aviso-ro" id="aviso-ro" hidden>⚠️ Esta visualização está em modo leitura — dá pra acompanhar tudo, mas o botão de responder não vai gravar. Me responda pelo chat mesmo.</div>';

    h += '<section class="luiz" aria-labelledby="tit-luiz">' +
         '<header><h2 id="tit-luiz">Sua vez, Luiz</h2><span class="nota">o que só você pode fazer</span></header>' +
         '<ul class="tarefas">';
    dados.tarefas.forEach(function (t) { h += tarefaHTML(t); });
    h += "</ul></section>";

    h += '<div class="secao-rot">Agentes</div><div class="grade">';
    dados.agentes.forEach(function (a) { h += agenteHTML(a); });
    h += "</div>";

    var d = dados.dependencia;
    h += '<div class="secao-rot">Um esperando o outro</div>' +
         '<section class="dependencia"><div class="rota">' + esc(d.rota) + "</div>" +
         "<h3>" + esc(d.titulo) + "</h3>";
    d.paragrafos.forEach(function (p) { h += "<p>" + rico(p) + "</p>"; });
    h += "</section>";

    h += '<footer class="rodape">' +
         "<span>Esta página se atualiza sozinha: quando eu republico, toda janela aberta recarrega — não precisa botão de atualizar nem recarregar na mão. As barras de evolução são leitura minha, não medição automática.</span>" +
         '<span class="links">' +
         '<a class="botao" href="https://github.com/contatoarrudacred/hub-arruda" target="_blank" rel="noopener">repositório</a>' +
         '<a class="botao" href="https://supabase.com/dashboard/project/mzvaqjhalynaceecnayt/sql/new" target="_blank" rel="noopener">SQL Editor</a>' +
         '<a class="botao" href="https://hub-arruda.vercel.app" target="_blank" rel="noopener">app</a>' +
         "</span></footer>";

    h += "</div>";
    return h;
  }

  function render() {
    document.getElementById("raiz").innerHTML = corpoHTML();
    if (podeEscrever === false) {
      var av = document.getElementById("aviso-ro");
      if (av) av.hidden = false;
    }
  }

  // Página completa de substituição — exigida pelo publish(): documento
  // inteiro, começando por doctype. Estilo e script saem das próprias tags
  // (conteúdo autoral, não o DOM vivo), e os dados vão serializados com o
  // estado novo.
  function paginaCompleta() {
    var css = document.getElementById("estilo").textContent;
    var app = document.getElementById("app").textContent;
    var json = JSON.stringify(dados, null, 1).replace(/<\//g, "<\\/");
    return "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
      "<title>Torre de Controle Arruda</title>\n" +
      "<style id=\"estilo\">" + css + "</style>\n</head>\n<body>\n" +
      "<div id=\"raiz\"></div>\n" +
      "<script id=\"dados\" type=\"application/json\">\n" + json + "\n<\/script>\n" +
      "<script id=\"app\">" + app + "<\/script>\n</body>\n</html>";
  }

  function agora() {
    var d = new Date();
    var p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return p(d.getDate()) + "/" + p(d.getMonth() + 1) + " · " + p(d.getHours()) + "h" + p(d.getMinutes());
  }

  function acharTarefa(id) {
    for (var i = 0; i < dados.tarefas.length; i++) {
      if (dados.tarefas[i].id === id) return dados.tarefas[i];
    }
    return null;
  }

  function marcarErro(id, msg) {
    var caixa = document.getElementById("resp-" + id);
    if (!caixa) return;
    var dica = caixa.querySelector(".dica");
    if (dica) dica.textContent = msg;
  }

  async function enviar(id) {
    var caixa = document.getElementById("resp-" + id);
    var ta = caixa.querySelector("textarea");
    var texto = ta.value.trim();
    if (!texto) { ta.focus(); return; }

    var btn = caixa.querySelector(".enviar");
    btn.disabled = true;
    btn.textContent = "Enviando…";

    var api = null;
    try { api = await window.claude.use("artifact"); } catch (e) { api = null; }

    if (!api) {
      podeEscrever = false;
      btn.disabled = false;
      btn.textContent = "Enviar pro Coordenador";
      marcarErro(id, "⚠️ Não consegui gravar daqui (visualização em modo leitura). Copie o texto e me mande pelo chat.");
      var av = document.getElementById("aviso-ro");
      if (av) av.hidden = false;
      return;
    }

    var tarefa = acharTarefa(id);
    tarefa.respostas = tarefa.respostas || [];
    tarefa.respostas.push({ quando: agora(), texto: texto });

    try {
      await api.publish(paginaCompleta());
      // Publicou: a própria view recarrega na versão nova.
    } catch (err) {
      var code = err && err.code ? err.code : "upstream_error";
      if (code === "conflict") {
        // Rotina: outra versão entrou antes. A view já está recarregando.
        return;
      }
      // Desfaz o otimismo e explica.
      tarefa.respostas.pop();
      btn.disabled = false;
      btn.textContent = "Enviar pro Coordenador";
      if (code === "not_writer" || code === "not_granted" || code === "capability_disabled" || code === "not_declared") {
        podeEscrever = false;
        var av2 = document.getElementById("aviso-ro");
        if (av2) av2.hidden = false;
        marcarErro(id, "⚠️ Esta visualização é só leitura. Copie o texto e me mande pelo chat.");
      } else if (code === "rate_limited") {
        marcarErro(id, "⏳ Muitas respostas seguidas. Espere alguns segundos e tente de novo.");
      } else {
        marcarErro(id, "⚠️ Não consegui gravar agora. Tente de novo em instantes — se insistir, me mande pelo chat.");
      }
    }
  }

  document.addEventListener("click", function (ev) {
    var alvo = ev.target.closest ? ev.target.closest("button.botao") : null;
    if (!alvo) return;
    var id = alvo.getAttribute("data-alvo");
    if (!id) return;

    if (alvo.classList.contains("abrir")) {
      var caixa = document.getElementById("resp-" + id);
      caixa.hidden = !caixa.hidden;
      if (!caixa.hidden) caixa.querySelector("textarea").focus();
    } else if (alvo.classList.contains("cancelar")) {
      var c = document.getElementById("resp-" + id);
      c.querySelector("textarea").value = "";
      c.hidden = true;
    } else if (alvo.classList.contains("enviar")) {
      enviar(id);
    }
  });

  render();
})();
</script>
